name: ArchLens cache

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archlens-warm
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: archlens/ArchLens-Action@4f690f028055f6b225044860ccbc00bfee6de1fa
        with:
          warm-cache: 'true'
          preset: "go"
