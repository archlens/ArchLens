name: Test and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run checks
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          check: "**"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

  build:
    needs: test
    if: success() 
    permissions:
        contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment
        uses: actions/checkout@v4
      - name: Build and export
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          module: .
          args: build export --path=./build
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"
      - name: Package binaries
        run: |
          set -euo pipefail
          dist="$PWD/dist"
          mkdir -p "$dist"
          for dir in build/*/; do
            target=$(basename "$dir")
            if [[ "$target" == windows-* ]]; then
              (cd "$dir" && zip -r "$dist/archlens-${target}.zip" .)
            else
              tar -czvf "$dist/archlens-${target}.tar.gz" -C "$dir" .
            fi
          done
          ls -la "$dist"
      - name: Auto Changelog
        uses: ardalanamini/auto-changelog@506d604cdb8ec964c260a43c4e2f594ba30bfecc
        id  : changelog
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-types: |
              feat: New Features
              fix: Bug Fixes
              build: Build System & Dependencies
              perf: Performance Improvements
              docs: Documentation
              test: Tests
              refactor: Refactors
              chore: Chores
              ci: CI
              cd: CD
              ci/cd: CI/CD
              style: Code Style
              revert: Reverts
      - name: Create release
        uses: softprops/action-gh-release@v8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          body: ${{steps.changelog.outputs.changelog}}
          files: |
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}