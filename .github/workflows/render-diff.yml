name: RenderDiff on Pull-Request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: archlens-action
        uses: archlens/ArchLens-Action@v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preset: "go"
          edit-in-place: true
