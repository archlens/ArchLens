name: RenderDiff on Pull-Request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: archlens-action
        uses: archlens/ArchLens-Action@4f690f028055f6b225044860ccbc00bfee6de1fa
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preset: "go"
          edit-in-place: true
